
services:
  backend:
    build:
      context: ./backend-accessoires
    container_name: backend-accessoires
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 1337
    ports:
      - "1337:1337"
    volumes:
      - ./backend-accessoires:/app
      - /app/node_modules
    networks:
      - boutique-network

  frontend:
    build:
      context: ./frontend-vitrine
    container_name: frontend-vitrine
    environment:
      NODE_ENV: development
      HOSTNAME: 0.0.0.0
      PORT: 3000
      STRAPI_URL: http://backend:1337
      NEXT_PUBLIC_API_URL: http://localhost:1337
    ports:
      - "3000:3000"
    volumes:
      - ./frontend-vitrine:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    networks:
      - boutique-network

networks:
  boutique-network:
    driver: bridge
